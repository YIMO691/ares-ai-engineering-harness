name: Build and test
on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build and test with external output
        shell: pwsh
        run: ./scripts/Test-Workbench.ps1 -ScratchRoot 'D:/AgentWorkspace/ci/scratch' -EvidenceRoot 'D:/AgentWorkspace/ci/evidence'
